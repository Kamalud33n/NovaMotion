<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="stylesheet" href="/static/admin/admin.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        {% include "admin/_sidebar.html" %}

        <main class="main-content">
            <header class="top-bar glass-effect">
                <div class="top-bar-left">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumb">
                        <span>Admin</span>
                        <i class="fas fa-chevron-right"></i>
                        <span class="active">Settings</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="header-left" style="margin-bottom:8px;">
                    <h2>Settings</h2>
                    <div class="header-subtitle">Manage your admin profile and account security.</div>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">Account</div>
                    <div class="settings-grid">
                        <div class="settings-card glass-effect">
                            <h3><i class="fas fa-user-shield"></i> Profile Details</h3>
                            <form id="profileForm" onsubmit="submitProfileForm(event)">
                                <div class="settings-form-row" style="margin-bottom:16px;">
                                    <div class="form-group">
                                        <label>Full Name</label>
                                        <input type="text" id="p_full_name" class="form-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Email</label>
                                        <input type="text" id="p_email" class="form-input" disabled>
                                    </div>
                                </div>
                                <div class="settings-form-row" style="margin-bottom:16px;">
                                    <div class="form-group">
                                        <label>Phone</label>
                                        <input type="text" id="p_phone" class="form-input">
                                    </div>
                                    <div class="form-group">
                                        <label>Role</label>
                                        <input type="text" id="p_role" class="form-input" disabled>
                                    </div>
                                </div>
                                <div class="form-group" style="margin-bottom:20px;">
                                    <label>Specialization</label>
                                    <input type="text" id="p_specialization" class="form-input" placeholder="Optional">
                                </div>
                                <button type="submit" class="btn-primary" id="profileSubmitBtn">
                                    <i class="fas fa-save"></i> Save Profile
                                </button>
                            </form>

                            <!-- Read-only account info, folded into the same card -->
                            <div class="settings-account-strip" id="accountInfo">
                                <span><i class="fas fa-spinner fa-spin"></i> Loading...</span>
                            </div>
                        </div>

                        <div class="settings-card glass-effect">
                            <h3><i class="fas fa-lock"></i> Change Password</h3>
                            <form id="passwordForm" onsubmit="submitPasswordForm(event)">
                                <div class="form-group" style="margin-bottom:16px;">
                                    <label>Current Password</label>
                                    <input type="password" id="pw_current" class="form-input" required>
                                </div>
                                <div class="form-group" style="margin-bottom:16px;">
                                    <label>New Password (min {{ password_min_length }} characters)</label>
                                    <input type="password" id="pw_new" class="form-input" required minlength="{{ password_min_length }}">
                                </div>
                                <div class="form-group" style="margin-bottom:20px;">
                                    <label>Confirm New Password</label>
                                    <input type="password" id="pw_confirm" class="form-input" required minlength="{{ password_min_length }}">
                                </div>
                                <button type="submit" class="btn-primary" id="passwordSubmitBtn">
                                    <i class="fas fa-key"></i> Update Password
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/admin/admin.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', loadProfile);

    async function loadProfile() {
        try {
            const p = await apiRequest('/api/auth/profile');
            document.getElementById('p_full_name').value = p.full_name || '';
            document.getElementById('p_email').value = p.email || '';
            document.getElementById('p_phone').value = p.phone || '';
            document.getElementById('p_role').value = p.role ? (p.role[0].toUpperCase() + p.role.slice(1)) : '';
            document.getElementById('p_specialization').value = p.specialization || '';

            document.getElementById('accountInfo').innerHTML = `
                <span><i class="fas fa-hashtag"></i> ${escapeHtml(p.id)}</span>
                <span><i class="fas fa-calendar-plus"></i> Joined ${p.date_created ? formatDate(p.date_created) : '\u2014'}</span>
                <span><i class="fas fa-sign-in-alt"></i> Last login ${p.last_login ? formatDateTime(p.last_login) : 'Never'}</span>
            `;
        } catch (e) {
            console.error('loadProfile:', e);
        }
    }

    async function submitProfileForm(evt) {
        evt.preventDefault();
        const btn = document.getElementById('profileSubmitBtn');
        const payload = {
            full_name: document.getElementById('p_full_name').value,
            phone: document.getElementById('p_phone').value,
            specialization: document.getElementById('p_specialization').value,
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        try {
            await apiRequest('/api/auth/profile', { method: 'PUT', body: JSON.stringify(payload) });
            showToast('Profile updated', 'success');
            document.querySelector('.status-text').textContent = payload.full_name;
        } catch (e) {
            console.error('submitProfileForm:', e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Save Profile';
        }
    }

    async function submitPasswordForm(evt) {
        evt.preventDefault();
        const btn = document.getElementById('passwordSubmitBtn');
        const current = document.getElementById('pw_current').value;
        const next = document.getElementById('pw_new').value;
        const confirm_ = document.getElementById('pw_confirm').value;

        if (next !== confirm_) {
            showToast('New passwords do not match', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
        try {
            await apiRequest('/api/auth/change-password', {
                method: 'POST',
                body: JSON.stringify({ current_password: current, new_password: next, confirm_password: confirm_ }),
            });
            showToast('Password updated', 'success');
            document.getElementById('passwordForm').reset();
        } catch (e) {
            console.error('submitPasswordForm:', e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Update Password';
        }
    }
    </script>
</body>
</html>
