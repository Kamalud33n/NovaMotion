<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Requests - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="stylesheet" href="/static/admin/admin.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        {% include "admin/_sidebar.html" %}

        <main class="main-content">
            <header class="top-bar glass-effect">
                <div class="top-bar-left">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumb">
                        <span>Admin</span>
                        <i class="fas fa-chevron-right"></i>
                        <span class="active">Approval Requests</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="patients-header">
                    <div class="header-left">
                        <h2>Approval Requests</h2>
                        <div class="header-subtitle" id="requestCountText">Loading...</div>
                    </div>
                    <div class="header-right filter-bar">
                        <div class="progress-filters" id="statusTabs">
                            <button class="filter-btn active" data-status="pending">Pending</button>
                            <button class="filter-btn" data-status="approved">Approved</button>
                            <button class="filter-btn" data-status="rejected">Rejected</button>
                        </div>
                    </div>
                </div>

                <div id="requestsList" style="display:flex; flex-direction:column; gap:14px;">
                    <div class="activity-empty"><i class="fas fa-spinner fa-spin"></i><span>Loading requests...</span></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/admin/admin.js"></script>
    <script>
    let _currentStatus = 'pending';

    document.addEventListener('DOMContentLoaded', () => {
        loadRequests();
        document.querySelectorAll('#statusTabs .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#statusTabs .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                _currentStatus = btn.dataset.status;
                loadRequests();
            });
        });
    });

    async function loadRequests() {
        try {
            const rows = await apiRequest(`/api/admin/approvals?status=${_currentStatus}`);
            document.getElementById('requestCountText').textContent =
                `${rows.length} ${_currentStatus} request${rows.length === 1 ? '' : 's'}`;
            renderRequests(rows);
        } catch (e) {
            console.error('loadRequests:', e);
            document.getElementById('requestsList').innerHTML =
                '<p style="color:#D9503E;padding:1rem;">Failed to load requests.</p>';
        }
    }

    function renderRequests(rows) {
        const el = document.getElementById('requestsList');
        if (!rows.length) {
            el.innerHTML = `
                <div class="activity-empty">
                    <i class="fas fa-inbox"></i>
                    <strong>No ${escapeHtml(_currentStatus)} requests</strong>
                    <span class="empty-sub">New registrations needing review will show up here.</span>
                </div>`;
            return;
        }

        el.innerHTML = rows.map(u => `
            <div class="request-card glass-effect">
                <div class="patient-avatar" style="width:52px;height:52px;font-size:18px;">${initials(u.full_name)}</div>
                <div class="request-info">
                    <div class="request-name">
                        ${escapeHtml(u.full_name)} ${roleBadge(u.role)}
                    </div>
                    <div class="request-meta">
                        <span><i class="fas fa-envelope"></i> ${escapeHtml(u.email)}</span>
                        ${u.phone ? `<span><i class="fas fa-phone"></i> ${escapeHtml(u.phone)}</span>` : ''}
                        ${u.specialization ? `<span><i class="fas fa-stethoscope"></i> ${escapeHtml(u.specialization)}</span>` : ''}
                        <span><i class="fas fa-calendar"></i> Applied ${timeAgo(u.date_created)}</span>
                    </div>
                </div>
                ${_currentStatus === 'pending' ? `
                <div class="request-actions">
                    <button class="btn-secondary" onclick="handleReject('${u.id}', '${escapeHtml(u.full_name).replace(/'/g, "\\'")}')">
                        <i class="fas fa-times"></i> Reject
                    </button>
                    <button class="btn-primary" onclick="handleApprove('${u.id}', '${escapeHtml(u.full_name).replace(/'/g, "\\'")}')">
                        <i class="fas fa-check"></i> Approve
                    </button>
                </div>` : statusBadge(u.status)}
            </div>
        `).join('');
    }

    async function handleApprove(id, name) {
        if (!confirm(`Approve ${name}'s account? They'll be able to sign in immediately.`)) return;
        try {
            await apiRequest(`/api/admin/approvals/${id}/approve`, { method: 'POST' });
            showToast(`${name} approved`, 'success');
            loadRequests();
        } catch (e) { console.error('handleApprove:', e); }
    }

    async function handleReject(id, name) {
        if (!confirm(`Reject ${name}'s registration request?`)) return;
        try {
            await apiRequest(`/api/admin/approvals/${id}/reject`, { method: 'POST' });
            showToast(`${name}'s request rejected`, 'success');
            loadRequests();
        } catch (e) { console.error('handleReject:', e); }
    }
    </script>
</body>
</html>
