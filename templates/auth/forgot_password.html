<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="stylesheet" href="/static/auth/auth.css?v=1">
</head>
<body class="auth-body" data-pw-min="{{ password_min_length }}">
    <main class="auth-card">
        <div class="auth-brand">
            <img src="/assets/logo.png?v=2" alt="" width="44" height="44">
            <div>
                <div class="brand-name">{{ app_name }}</div>
                <div class="brand-sub">THERAPY SYSTEM</div>
            </div>
        </div>

        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-lead">Enter the email you registered with and we'll send you a link to choose a new password.</p>

        <div class="auth-alert" id="authAlert" role="alert"></div>

        <form class="auth-form" id="forgotForm" novalidate>
            <div class="form-group">
                <label for="forgotEmail">Email</label>
                <input class="form-input" id="forgotEmail" name="email" type="email" autocomplete="email" placeholder="you@clinic.com" required>
            </div>
            <button type="submit" class="btn-primary auth-submit">Send reset link</button>
        </form>

        <div class="auth-state" id="forgotDone" hidden>
            <div class="state-icon ok">&#10003;</div>
            <p class="auth-lead" id="forgotDoneText"></p>
            <p class="field-hint">The link expires soon and works once. Check your spam folder if you don't see it.</p>
        </div>

        <div class="auth-back"><a href="/login">&larr; Back to sign in</a></div>
    </main>
    <script src="/static/auth/auth.js?v=1"></script>
</body>
</html>
